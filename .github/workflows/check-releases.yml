name: Check Releases

on:
  schedule:
    # 每天 01:00 UTC = 上海时间 09:00
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # GITHUB_TOKEN needs this or GitHub Models calls are denied and the script falls back.
  models: read

concurrency:
  group: check-releases
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for new releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_releases.py

      - name: Commit and push reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ state/last_seen.json README.md || true
          if git diff --staged --quiet; then
            echo "没有文件变更，跳过提交。"
            exit 0
          fi
          git commit -m "chore: update release reports $(date -u +%Y-%m-%d)"
          git push
