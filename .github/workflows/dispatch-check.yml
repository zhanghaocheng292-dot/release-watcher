# Temporary bootstrap: the agent token can push code but cannot call
# workflow_dispatch (missing actions:write). This workflow's GITHUB_TOKEN can.
name: Dispatch Check Releases

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-check.yml
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Check Releases via workflow_dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run check-releases.yml --ref main
